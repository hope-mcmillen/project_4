name: Online lobby checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lobby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
      - run: npx --yes firebase-tools@15.32.0 emulators:exec --project demo-chameleon --only auth,firestore,functions "npm --prefix functions test"
