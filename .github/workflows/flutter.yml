# The project's single CI workflow.
#
# Every push (any branch) and every pull request runs the same checks the team
# runs locally, then builds an installable release APK and keeps it as a
# downloadable workflow artifact. Pushing a version tag such as v1.2.3 also
# attaches that APK to a GitHub Release.
#
# The release APK is signed with the Android debug key (see
# android/app/build.gradle.kts). That is what makes it installable without a
# keystore in the repo; it is fine for demos and grading, not for a store.
name: Flutter CI

on:
  push:
    # Listing tags means branches must be listed too, or branch pushes would
    # stop triggering the workflow. '**' matches every branch, including ones
    # with slashes such as feature/CHM-16-app-identity.
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

# Least privilege by default; only the release job below can write.
permissions:
  contents: read

# A newer push to the same branch, tag or pull request makes the older run
# pointless, so cancel it instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Gradle for the APK build. 17 matches the Java/Kotlin target in
      # android/app/build.gradle.kts.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: chameleon-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Attach APK to GitHub Release
    # Only a pushed v*.*.* tag reaches this job; branch pushes and pull
    # requests stop after the checks and the artifact upload.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chameleon-apk

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="chameleon-${TAG}.apk"
          mv app-release.apk "$apk"
          # Re-running the job, or tagging after drafting a release by hand,
          # must not fail just because the release already exists.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --title "$TAG" --generate-notes --verify-tag
          fi
